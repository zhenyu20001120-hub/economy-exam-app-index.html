<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#d9631f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="工商刷题" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="build" content="v20260817b" />
  <title>中级经济师·工商管理 刷题</title>
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div class="empty" style="padding-top:90px">
      <div style="font-size:40px">⏳</div>
      <div style="margin-top:12px;font-weight:600;color:var(--brand)">正在准备题库…</div>
    </div>
  </div>
  <nav id="tabbar" hidden>
    <button data-nav="home"><span>🏠</span>首页</button>
    <button data-nav="practice"><span>✏️</span>刷题</button>
    <button data-nav="rounds"><span>📚</span>三轮</button>
    <button data-nav="wrong"><span>📕</span>错题</button>
    <button data-nav="exam"><span>📝</span>模考</button>
  </nav>
  <script>
    // PWA：注册 Service Worker；当检测到“新版本已接管”时自动刷新一次，
    // 避免「旧 app.js + 新 index.html」缓存不一致导致的异常（如用户名输入框丢失/点不动）。
    // 仅对“已有旧 SW 的更新场景”刷新，首次安装不强制刷新。
    if ('serviceWorker' in navigator) {
      var _hadSW = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').catch(function () {});
      var _swRefreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (_swRefreshing || !_hadSW) return;
        _swRefreshing = true;
        window.location.reload();
      });
    }
  </script>
  <script src="app.js"></script>
</body>
</html>

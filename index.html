<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>中级经济师·工商管理 刷题</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3b5bdb">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --primary:#3b5bdb; --primary-d:#2f4bc0;
  --text:#1f2430; --sub:#6b7280; --line:#e6e9f0; --green:#2f9e44; --red:#e03131;
  --orange:#f08c00; --soft:#eef2ff; --shadow:0 4px 18px rgba(30,40,90,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.6;}
.app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:80px;}
header{background:linear-gradient(135deg,#3b5bdb,#5c7cfa);color:#fff;padding:18px 18px 22px;}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.5px}
header .meta{margin-top:6px;font-size:12.5px;opacity:.92}
.wrap{padding:14px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mode-btn{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px 14px;text-align:center;
  cursor:pointer;transition:transform .08s ease,box-shadow .15s;}
.mode-btn:active{transform:scale(.97)}
.mode-btn .ic{font-size:30px;line-height:1}
.mode-btn .t{font-weight:700;margin-top:8px;font-size:15.5px}
.mode-btn .d{font-size:11.5px;color:var(--sub);margin-top:3px}
.stats{display:flex;justify-content:space-around;text-align:center;padding:6px 0}
.stats .num{font-size:22px;font-weight:800;color:var(--primary)}
.stats .lab{font-size:11.5px;color:var(--sub);margin-top:2px}
.chapter{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.chapter:last-child{border-bottom:none}
.chapter .name{font-weight:600}
.chapter .w{font-size:11px;color:var(--sub)}
.bar{height:7px;background:var(--line);border-radius:6px;margin-top:6px;overflow:hidden;width:120px}
.bar>i{display:block;height:100%;background:var(--primary)}
.chapter .pct{font-size:12px;color:var(--sub);width:42px;text-align:right}
.qtag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-right:8px}
.tag-single{background:#e7f5ff;color:#1c7ed6}
.tag-multiple{background:#fff0f6;color:#c2255c}
.tag-case{background:#fff9db;color:#b08900}
.tag-real{background:#ebfbee;color:#2f9e44;border:1px solid #b2f2bb}
.qtype{font-size:13px;color:var(--sub);margin-bottom:8px}
.stem{font-size:16.5px;font-weight:600;margin:4px 0 16px;white-space:pre-wrap}
.casebg{background:var(--soft);border-left:4px solid var(--primary);padding:12px 14px;border-radius:10px;font-size:14px;color:#33415c;margin-bottom:14px;white-space:pre-wrap}
.opt{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer;transition:.12s}
.opt:active{background:#f8f9fc}
.opt.sel{border-color:var(--primary);background:#f3f6ff}
.opt .mk{width:24px;height:24px;border-radius:50%;border:2px solid #cdd3e0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#8c94a6;flex:0 0 auto}
.opt.multi .mk{border-radius:7px}
.opt.correct{border-color:var(--green);background:#ebfbee}
.opt.correct .mk{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fff5f5}
.opt.wrong .mk{background:var(--red);border-color:var(--red);color:#fff}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;
  background:var(--primary);color:#fff;cursor:pointer;margin-top:6px}
.btn:disabled{background:#bac3e0;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn.orange{background:var(--orange)}
.nav{display:flex;gap:10px;margin-top:12px}
.nav .btn{margin-top:0}
.analysis{background:#f8f9fc;border-radius:12px;padding:14px;margin-top:14px;border:1px solid var(--line)}
.wrong-detail{margin-top:10px}
.analysis .h{font-weight:700;color:var(--primary);font-size:13.5px;margin-bottom:6px}
.analysis .ok{color:var(--green);font-weight:700}
.analysis .no{color:var(--red);font-weight:700}
.analysis p{margin:6px 0 0;font-size:14.5px;color:#374151;white-space:pre-wrap}
/* 三层解析 */
.layer{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.layer:first-of-type{border-top:none;margin-top:8px;padding-top:0}
.layer-h{font-weight:800;color:var(--primary);font-size:14px;margin-bottom:8px;
  background:var(--soft);display:inline-block;padding:3px 10px;border-radius:8px}
.opt-note{font-size:14px;color:#374151;margin:5px 0;padding-left:4px;border-left:3px solid var(--line)}
.opt-note.ok{border-left-color:var(--green)}
.opt-note.no{border-left-color:var(--red)}
.opt-note b{color:var(--text)}
/* 思维导图 */
.mm-box{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mm-box summary{cursor:pointer;font-weight:700;color:var(--primary);font-size:13.5px}
.mm-node{margin-top:6px;font-weight:700;color:#1f2430;font-size:14px}
.mm-leaf{margin:3px 0;font-size:13.5px;color:#374151}
/* 知识页 */
.kp-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.kp-card .nm{font-weight:700;font-size:16px}
.kp-card .w{font-size:11.5px;color:var(--sub)}
.kp-section{margin-top:14px}
.kp-section .h{font-weight:800;color:var(--primary);font-size:14px;margin-bottom:6px}
.kp-block{font-size:14.5px;color:#374151;line-height:1.7;white-space:pre-wrap}
.kp-act{margin-top:16px}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:8px}
.pcell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;
  background:#fff;border:1.5px solid var(--line);color:var(--sub)}
.pcell.cur{border-color:var(--primary);color:var(--primary);font-weight:700}
.pcell.done{background:var(--primary);color:#fff;border-color:var(--primary)}
.pcell.wrong{background:var(--red);color:#fff;border-color:var(--red)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;position:sticky;top:0;
  background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.topbar .back{cursor:pointer;font-size:15px;color:var(--primary);font-weight:600}
.timer{font-size:15px;font-weight:700;color:var(--orange)}
.muted{color:var(--sub);font-size:13px}
.center{text-align:center}
.big{font-size:46px;font-weight:800;color:var(--primary)}
.pass{color:var(--green)} .fail{color:var(--red)}
.result-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item{padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item .q{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:0 auto;display:flex;background:var(--card);
  border-top:1px solid var(--line);z-index:6}
.bottom div{flex:1;text-align:center;padding:11px 0;font-size:12.5px;color:var(--sub);cursor:pointer}
.bottom div.act{color:var(--primary);font-weight:700}
.bottom .ic{font-size:20px;display:block}
@media(max-width:480px){.app{font-size:15px}.grid{gap:10px}.mode-btn{padding:15px 10px}.palette{grid-template-columns:repeat(7,1fr)}}
/* 云同步 / 设置 */
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sync-box input{width:100%;box-sizing:border-box;padding:9px 10px;margin:6px 0;border:1px solid #dee2e6;border-radius:8px;font-size:13px}
.sync-box .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync-box .hint{font-size:12px;color:#868e96;line-height:1.6}
.sync-status{font-size:12px;color:#868e96;margin-top:6px}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#ced4da;border-radius:24px;transition:.2s}
.slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--primary)}
.switch input:checked + .slider:before{transform:translateX(20px)}
/* 用户身份(分享不串数据) */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#eef2ff,#f8f9fc)}
.gate-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:28px 22px;max-width:380px;width:100%;text-align:center}
.gate-logo{font-size:52px}
.gate-card h2{margin:6px 0 4px;font-size:20px}
.gate-card input{width:100%;box-sizing:border-box;padding:12px;margin:12px 0 0;border:1.5px solid var(--line);border-radius:10px;font-size:16px;text-align:center}
.gate-card .btn{margin-top:14px}
.user-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;justify-content:center}
.chip{background:var(--soft);color:var(--primary);border:1px solid var(--primary);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
.user-bar{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.user-bar .link{color:var(--primary);font-weight:700;cursor:pointer}

/* ===== 机考风格(模拟考试 / 三轮复习 共用) ===== */
.exam-topbar{position:sticky;top:0;z-index:9;background:linear-gradient(180deg,#1f3ba8,#2f4bc0);color:#fff;
  padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(31,40,80,.18)}
.exam-topbar .ttl{flex:0 0 auto;font-size:15.5px;font-weight:700}
.exam-topbar .ttl .sub{font-size:11.5px;opacity:.85;margin-left:6px;font-weight:500}
.exam-topbar .timer-wrap{margin-left:auto;display:flex;align-items:center;gap:8px}
.exam-topbar .timer-box{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);border-radius:8px;
  padding:4px 10px;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.exam-topbar .timer-box.warn{background:#fff3bf;color:#b08900;border-color:#ffe066}
.exam-topbar .timer-box.danger{background:#ffe3e3;color:#c92a2a;border-color:#ffa8a8;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.exam-topbar .meta{font-size:11.5px;opacity:.85;display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
.exam-topbar .submit-btn{background:#fa5252;border:none;color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.exam-topbar .submit-btn:active{transform:scale(.96)}

.exam-body{padding:12px 14px 100px;}
.exam-progress{background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--sub);box-shadow:var(--shadow)}
.exam-progress .bar{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.exam-progress .bar>i{display:block;height:100%;background:var(--primary);transition:width .25s}
.exam-progress .nums b{color:var(--primary);font-weight:700}

.exam-card{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:14px 14px 12px;margin-bottom:12px}
.exam-card .qhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:6px}
.exam-card .qhead .qno{font-weight:800;color:var(--text);font-size:15px;margin-right:4px}
.exam-card .casebg{margin:6px 0 12px;font-size:13.5px;line-height:1.65}
.exam-card .stem{font-size:16.5px;font-weight:600;margin:6px 0 12px;line-height:1.65;white-space:pre-wrap}
.exam-options{display:flex;flex-direction:column;gap:8px}
.exam-options .opt{padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:15px;line-height:1.55;transition:.12s}
.exam-options .opt:active{background:#f8f9fc}
.exam-options .opt.sel{border-color:var(--primary);background:#f3f6ff}
.exam-options .opt .mk{width:22px;height:22px;border-radius:50%;border:2px solid #cdd3e0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#8c94a6;flex:0 0 auto;margin-top:1px}
.exam-options .opt.multi .mk{border-radius:6px}
.exam-options .opt.correct{border-color:var(--green);background:#ebfbee}
.exam-options .opt.wrong{border-color:var(--red);background:#fff5f5}
.exam-options .opt .txt{flex:1}
.exam-helper{display:flex;gap:8px;margin-top:8px;font-size:12.5px}
.exam-helper .link{color:var(--primary);cursor:pointer;font-weight:600}
.exam-helper .link:hover{text-decoration:underline}

.exam-fb{background:#f8f9fc;border:1px solid var(--line);border-radius:12px;padding:12px 12px;margin-top:10px}
.exam-fb .h{font-weight:700;font-size:14px;margin-bottom:6px}
.exam-fb .ok{color:var(--green)} .exam-fb .no{color:var(--red)}
.exam-fb .layer{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.exam-fb .layer:first-of-type{border-top:none;padding-top:0;margin-top:0}
.exam-fb .layer-h{font-weight:700;color:var(--primary);font-size:13px;margin-bottom:4px}

.exam-bar{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:0 auto;background:#fff;border-top:1px solid var(--line);
  display:flex;gap:8px;padding:8px 12px;z-index:8;box-shadow:0 -2px 8px rgba(30,40,90,.05)}
.exam-bar .btn{margin:0;padding:11px;border-radius:10px;font-size:14px}
.exam-bar .btn.primary{flex:1;background:var(--primary)}
.exam-bar .btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.exam-bar .btn.orange{background:var(--orange);flex:0 0 90px}
.exam-bar .btn.mark{flex:0 0 80px;background:#fff8e6;color:#b08900;border:1.5px solid #ffe066}
.exam-bar .btn.mark.on{background:#ffe066;color:#5c4400}

/* 答题卡抽屉 */
.palette-overlay{position:fixed;inset:0;background:rgba(20,30,60,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.palette-overlay.show{display:flex}
.palette-drawer{background:#fff;width:100%;max-width:760px;border-top-left-radius:18px;border-top-right-radius:18px;
  padding:14px 16px 22px;max-height:82vh;overflow-y:auto}
.palette-drawer .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.palette-drawer .ph h3{margin:0;font-size:16px}
.palette-drawer .ph .x{cursor:pointer;font-size:22px;color:var(--sub);padding:0 4px}
.palette-tabs{display:flex;gap:6px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.palette-tabs .ptab{padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--sub);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent}
.palette-tabs .ptab.act{color:var(--primary);border-bottom-color:var(--primary)}
.palette-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:8px 0 10px;font-size:12px;color:var(--sub)}
.palette-legend .lg{display:flex;align-items:center;gap:4px}
.palette-legend .sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.palette-legend .sw.done{background:var(--primary);border-color:var(--primary)}
.palette-legend .sw.cur{background:#fff;border-color:var(--primary)}
.palette-legend .sw.mark{background:#ffe066;border-color:#ffe066}
.palette-legend .sw.empty{background:#fff;border-color:var(--line)}
.palette-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.palette-grid .pcell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;background:#fff;border:1.5px solid var(--line);color:var(--sub);cursor:pointer}
.palette-grid .pcell.cur{background:#fff;border-color:var(--primary);color:var(--primary)}
.palette-grid .pcell.done{background:var(--primary);color:#fff;border-color:var(--primary)}
.palette-grid .pcell.mark{background:#ffe066;color:#5c4400;border-color:#ffe066}
.palette-grid .pcell.correct{background:var(--green);color:#fff;border-color:var(--green)}
.palette-grid .pcell.wrong{background:var(--red);color:#fff;border-color:var(--red)}
@media(max-width:480px){.palette-grid{grid-template-columns:repeat(7,1fr)}.exam-topbar{padding:8px 10px}.exam-topbar .ttl{font-size:14px}}

/* 三轮复习面板 */
.round-pick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.round-pick .rp{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:18px 12px;text-align:center;cursor:pointer;position:relative}
.round-pick .rp.done{background:linear-gradient(135deg,#e6fcf5,#d3f9d8);color:#2b8a3e}
.round-pick .rp.cur{outline:2px solid var(--primary)}
.round-pick .rp .badge{position:absolute;top:6px;right:8px;font-size:11px;color:var(--sub)}
.round-pick .rp .no{font-size:24px;font-weight:800;color:var(--primary)}
.round-pick .rp.done .no{color:var(--green)}
.round-pick .rp .t{font-weight:700;margin-top:4px;font-size:14px}
.round-pick .rp .s{font-size:11.5px;color:var(--sub);margin-top:4px}
.round-pick .rp.done .s{color:#2b8a3e}
.round-info{margin-top:14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.round-info h4{margin:0 0 6px;font-size:14.5px}
.round-info ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;color:#374151;line-height:1.8}
</style>
</head>

const STORE = { wrong:'wrong', done:'done', correct:'correct', fav:'fav' };
const USERS_KEY='ee_users', USER_KEY='ee_user';
function curUser(){ return localStorage.getItem(USER_KEY) || ''; }
function setUser(u){ u=(u||'').toString().trim().slice(0,20); if(!u) return false; localStorage.setItem(USER_KEY, u);
  let us=[]; try{ us=JSON.parse(localStorage.getItem(USERS_KEY)||'[]')||[]; }catch(e){ us=[]; }
  if(!us.includes(u)){ us.push(u); localStorage.setItem(USERS_KEY, JSON.stringify(us)); } return true; }
function listUsers(){ try{ return JSON.parse(localStorage.getItem(USERS_KEY)||'[]')||[]; }catch(e){ return []; } }
function clearUser(){ localStorage.removeItem(USER_KEY); }
function pkey(base){ const u=curUser()||'guest'; return 'ee_'+u+'_'+base; }
function load(k){try{return JSON.parse(localStorage.getItem(pkey(k)))||[]}catch(e){return[]}}
function save(k,v){localStorage.setItem(pkey(k),JSON.stringify(v))}
function addUnique(k,id){let a=load(k);if(!a.includes(id)){a.push(id);save(k,a)}}
function removeUnique(k,id){let a=load(k);a=a.filter(x=>x!==id);save(k,a)}

/* ---------- 进度与云同步(跨设备记忆) ---------- */
const LASTPOS_KEY='ee_lastpos';
const SYNC_KEY='ee_sync';
let sync = loadSync();
function loadSync(){ try{ return Object.assign({on:false,token:'',repo:'',branch:'ee-sync'}, JSON.parse(localStorage.getItem(SYNC_KEY)||'{}')); }catch(e){ return {on:false,token:'',repo:'',branch:'ee-sync'}; } }
function saveSync(){ localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); }
function getLastPos(){ try{ return JSON.parse(localStorage.getItem(pkey('lastpos'))||'null'); }catch(e){ return null; } }
function setLastPos(p){ localStorage.setItem(pkey('lastpos'), JSON.stringify(p)); }
let _pushTimer=null;
function recordPos(mode, ch, idx){
  setLastPos({mode:mode, chapter:ch, idx:idx, ts:Date.now()});
  schedulePush();
}
function getProgress(){
  return { v:1, ts:Date.now(),
    wrong: load(STORE.wrong), done: load(STORE.done),
    correct: load(STORE.correct), fav: load(STORE.fav),
    last: getLastPos() };
}
function applyProgress(p){
  if(!p) return;
  if(Array.isArray(p.wrong)) save(STORE.wrong, p.wrong);
  if(Array.isArray(p.done)) save(STORE.done, p.done);
  if(Array.isArray(p.correct)) save(STORE.correct, p.correct);
  if(Array.isArray(p.fav)) save(STORE.fav, p.fav);
  if(p.last) setLastPos(p.last);
}
function schedulePush(){
  if(typeof setTimeout==='undefined') return;
  if(_pushTimer) clearTimeout(_pushTimer);
  _pushTimer = setTimeout(pushCloud, 1500);
}
function b64encode(s){ return (typeof btoa!=='undefined') ? btoa(unescape(encodeURIComponent(s))) : Buffer.from(s,'utf8').toString('base64'); }
function b64decode(s){ return (typeof atob!=='undefined') ? decodeURIComponent(escape(atob(s))) : Buffer.from(s,'base64').toString('utf8'); }
async function pushCloud(){
  if(!sync.on || !sync.token || !sync.repo) return;
  const path='data/'+encodeURIComponent(curUser()||'guest')+'/progress.json';
  const content=b64encode(JSON.stringify(getProgress()));
  const base=`https://api.github.com/repos/${sync.repo}/contents/${path}`;
  try{
    const head=await fetch(base+'?ref='+sync.branch, {headers:{Authorization:'Bearer '+sync.token, Accept:'application/vnd.github+json'}});
    let sha=null;
    if(head.ok){ const j=await head.json(); sha=j.sha; }
    else if(head.status!==404){ console.warn('sync meta', head.status); }
    const body=JSON.stringify({message:'ee progress sync', content:content, branch:sync.branch, sha:sha||undefined});
    const r=await fetch(base, {method:'PUT', headers:{Authorization:'Bearer '+sync.token, Accept:'application/vnd.github+json','Content-Type':'application/json'}, body:body});
    if(r.ok){ setSyncStatus('已同步 '+new Date().toLocaleTimeString()); }
    else { console.warn('push fail', r.status); setSyncStatus('同步失败('+r.status+')'); }
  }catch(e){ console.warn('push error', e.message); setSyncStatus('同步失败(网络)'); }
}
async function pullCloud(){
  if(!sync.on || !sync.token || !sync.repo) return;
  const path='data/'+encodeURIComponent(curUser()||'guest')+'/progress.json';
  const url=`https://api.github.com/repos/${sync.repo}/contents/${path}?ref=${sync.branch}`;
  try{
    const r=await fetch(url, {headers:{Authorization:'Bearer '+sync.token, Accept:'application/vnd.github+json'}});
    if(!r.ok) return;
    const j=await r.json();
    const p=JSON.parse(b64decode(j.content));
    const local=getProgress();
    if(!local.ts || (p.ts && p.ts>local.ts)){ applyProgress(p); setSyncStatus('已从云端恢复'); }
    else { setSyncStatus('本地较新，无需恢复'); }
  }catch(e){ console.warn('pull error', e.message); }
}

function onSyncOnChange(v){ sync.on=v; saveSync(); setSyncStatus(v?'已开启，去填仓库与Token':'未开启'); }

/* ---------- 开始练习 ---------- */
function startMode(mode, chId, idx){
  let items=[];
  if(mode==='chapter'){ items = chId? byChapter(chId) : ALL; }
  else if(mode==='wrong'){
    const ws=new Set(load(STORE.wrong));
    items=ALL.filter(x=>ws.has(x.id));
    if(!items.length){alert('还没有错题，先去练几题吧！');return;}
  }
  else if(mode==='random'){
    const pool=ALL.slice();
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
    items=pool.slice(0, Math.min(30, pool.length));
  }
  else if(mode==='mock'){ items = buildMock(); }
  else if(mode==='round'){
    const r = +(typeof chId==='number'?chId:1);
    items = buildRound(r);
    if(!items.length){alert('该轮题库不足');return;}
    state.round = r;
  }
  if(!items.length){alert('暂无可练习的题目');return;}
  state.mode=mode; state.items=items; state.idx=(typeof idx==='number')?idx:0; state.answers={}; state.marked={};
  if(mode==='mock' || mode==='round'){
    state.start=Date.now();
    state.dur = (mode==='mock') ? DATA.meta.timeMinutes*60 : Math.max(30*60, items.length*1.2*60);
    startTimer();
  } else { state.timer&&clearInterval(state.timer); state.timer=null; }
  renderQuestion();
  window.scrollTo(0,0);
}

function buildMock(){
  const single=ALL.filter(x=>x.type==='single' && !x.caseBg);
  const multi=ALL.filter(x=>x.type==='multiple' && !x.caseBg);
  const caseSubs=ALL.filter(x=>x.caseBg);
  const pick=(arr,n)=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,Math.min(n,a.length));};
  const items=[...pick(single,60), ...pick(multi,20), ...caseSubs.slice(0,20)];
  const have=new Set(items.map(x=>x.id));
  // 补满至100题(用剩余单选)
  const rest=single.filter(x=>!have.has(x.id));
  let ri=0;
  while(items.length<100 && ri<rest.length){ items.push(rest[ri++]); }
  // 打乱顺序
  for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
  return items;
}

/* 三轮复习: 每轮约160题, 三轮跨轮去重、累计覆盖全库(所有细节题) */
function buildRound(roundNum){
  roundNum = +roundNum || 1;
  let picked = new Set(getRoundsPicked());
  let pool = ALL.filter(x=>!picked.has(x.id));
  if(pool.length===0){ // 三轮已全部抽完 → 重置从头再练
    resetRoundsPicked(); picked = new Set();
    pool = ALL.slice();
  }
  // 打乱剩余题库
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const TARGET = 160;
  // 第3轮(收尾轮)抽完剩余全部, 保证三轮累计覆盖整本题库每一个细节题
  const take = (roundNum>=3) ? pool.length : Math.min(TARGET, pool.length);
  const items = pool.slice(0, take);
  items.forEach(x=>addRoundsPicked(x.id));
  // 最终顺序再打乱(不按原顺序)
  for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
  return items;
}
function getRoundsPicked(){ try{return JSON.parse(localStorage.getItem(pkey('roundsPicked'))||'[]')||[];}catch(e){return [];} }
function addRoundsPicked(id){ const a=getRoundsPicked(); if(!a.includes(id)){a.push(id); localStorage.setItem(pkey('roundsPicked'), JSON.stringify(a));} }
function resetRoundsPicked(){ localStorage.removeItem(pkey('roundsPicked')); }
function getRoundResults(){ try{return JSON.parse(localStorage.getItem(pkey('roundResults'))||'{}')||{};}catch(e){return {};} }
function setRoundResult(round, score, pass){ const r=getRoundResults(); r['r'+round]={score:score, pass:!!pass, ts:Date.now()}; localStorage.setItem(pkey('roundResults'), JSON.stringify(r)); }
function resetRoundResults(){ localStorage.removeItem(pkey('roundResults')); }

/* ---------- 计时器(机考样式) ---------- */
function startTimer(){
  if(state.timer){ clearInterval(state.timer); state.timer=null; }
  const tick=()=>{
    const left=state.dur-Math.floor((Date.now()-state.start)/1000);
    const tb=document.getElementById('examTimerBox');
    const mLabel=document.getElementById('examTimerLabel');
    if(left<=0){
      if(state.timer){clearInterval(state.timer); state.timer=null;}
      if(tb) tb.textContent='00:00';
      finishExam();
      return;
    }
    const m=String(Math.floor(left/60)).padStart(2,'0'), s=String(left%60).padStart(2,'0');
    if(tb){ tb.textContent=m+':'+s; tb.classList.remove('warn','danger'); if(left<300) tb.classList.add('danger'); else if(left<900) tb.classList.add('warn'); }
    if(mLabel) mLabel.textContent='剩余';
  };
  tick();
  state.timer=setInterval(tick,1000);
}

  const isLast = state.idx===state.items.length-1;
  const bar = el(`<div class="exam-bar">
     <button class="btn ghost" onclick="prevQ()" ${state.idx===0?'disabled':''}>上一题</button>
     <button class="btn mark ${marked?'on':''}" onclick="toggleMark()">${marked?'★ 已标记':'☆ 标记'}</button>
     ${isLast
        ? `<button class="btn orange" onclick="tryFinish()">交卷</button>`
        : `<button class="btn primary" onclick="nextQ()">下一题</button>`}
  </div>`);
  document.body.appendChild(bar);
  // 答题卡 overlay
  ensurePalette();
  renderPalette();
  // 启动计时器(若尚未启动)
  if(!state.timer){ startTimer(); }
  else { // 立刻刷新顶部计时
    const tb=document.getElementById('examTimerBox');
    const left=state.dur-Math.floor((Date.now()-state.start)/1000);
    if(tb){ const m=String(Math.floor(left/60)).padStart(2,'0'), s=String(left%60).padStart(2,'0'); tb.textContent=m+':'+s; }
  }
  recordPos(state.mode, q.chapter, state.idx);
}

/* 答题卡 overlay */
let _paletteTab='single';
function ensurePalette(){
  if(document.getElementById('paletteOverlay')) return;
  const ov = el(`<div class="palette-overlay" id="paletteOverlay" onclick="if(event.target===this)closePalette()">
    <div class="palette-drawer">
       <div class="ph"><h3>📋 答题卡</h3><span class="x" onclick="closePalette()">×</span></div>
       <div class="palette-tabs" id="paletteTabs">
         <button class="ptab" data-t="single" onclick="switchPaletteTab('single')">单选题</button>
         <button class="ptab" data-t="multiple" onclick="switchPaletteTab('multiple')">多选题</button>
         <button class="ptab" data-t="case" onclick="switchPaletteTab('case')">案例分析</button>
       </div>
       <div class="palette-legend">
         <span class="lg"><span class="sw done"></span>已答</span>
         <span class="lg"><span class="sw cur"></span>当前</span>
         <span class="lg"><span class="sw mark"></span>已标记</span>
         <span class="lg"><span class="sw empty"></span>未答</span>
       </div>
       <div class="palette-grid" id="paletteGrid"></div>
       <div style="display:flex;gap:8px;margin-top:14px">
         <button class="btn ghost" onclick="closePalette()">继续答题</button>
         <button class="btn" style="background:var(--red)" onclick="confirmFinish()">确认交卷</button>
       </div>
    </div>
  </div>`);
  document.body.appendChild(ov);
}
function openPalette(){ ensurePalette(); renderPalette(); document.getElementById('paletteOverlay').classList.add('show'); }
function closePalette(){ const ov=document.getElementById('paletteOverlay'); if(ov) ov.classList.remove('show'); }
function switchPaletteTab(t){ _paletteTab=t; renderPalette(); }
function renderPalette(){
  const grid=document.getElementById('paletteGrid'); if(!grid) return;
  // tabs 高亮
  document.querySelectorAll('#paletteTabs .ptab').forEach(b=>{
    b.classList.toggle('act', b.dataset.t===_paletteTab);
  });
  grid.innerHTML='';
  // 收集题目在 items 中按 idx 排序, 过滤类型(案例子题用 caseBg 标识, 单选/多选都可能)
  const filtered = state.items.map((q,i)=>({q,i})).filter(o=>{
    if(_paletteTab==='single') return o.q.type==='single' && !o.q.caseBg;
    if(_paletteTab==='multiple') return o.q.type==='multiple' && !o.q.caseBg;
    return !!o.q.caseBg; // 案例分析
  });
  if(!filtered.length){ grid.innerHTML='<div class="muted" style="grid-column:1/-1;text-align:center">该题型暂无题</div>'; return; }
  let caseSeq=0;
  filtered.forEach(({q,i})=>{
    const ans = state.answers[q.id]||[];
    const mk = state.marked[q.id];
    const cls = (i===state.idx)?'cur':(mk?'mark':(ans.length?'done':''));
    const label = q.caseBg ? ('案'+(++caseSeq)) : (i+1);
    grid.appendChild(el(`<div class="pcell ${cls}" onclick="gotoQuestion(${i})">${label}</div>`));
  });
}
function gotoQuestion(i){
  state.idx=i;
  closePalette();
  renderExamQuestion();
  window.scrollTo(0,0);
}
function toggleMark(){
  const id=state.items[state.idx].id;
  if(state.marked[id]) delete state.marked[id]; else state.marked[id]=1;
  renderExamQuestion();
}
function toggleAll(){
  const q=state.items[state.idx];
  if(q.type!=='multiple') return;
  const cur = state.answers[q.id]||[];
  if(cur.length===q.options.length){ state.answers[q.id]=[]; }
  else { state.answers[q.id]=q.options.map((_,i)=>i); }
  renderExamQuestion();
}
function tryFinish(){
  if(state.mode==='mock' || state.mode==='round'){ confirmFinish(); }
}
function confirmFinish(){
  const total=state.items.length, done=state.items.filter(q=>(state.answers[q.id]||[]).length>0).length;
  const und = total-done;
  if(typeof confirm==='function'){
    if(!confirm(`已答 ${done}/${total} 题，还有 ${und} 题未答。\n确认交卷？未答题将被记 0 分。`)) return;
  }
  closePalette();
  finishExam();
}

function toggleOpt(i){
  const q=state.items[state.idx];
  if(state.mode==='mock' || state.mode==='round'){
    let a=state.answers[q.id]||[];
    if(q.type==='multiple'){ if(a.includes(i))a=a.filter(x=>x!==i); else a.push(i); }
    else { a=[i]; }
    state.answers[q.id]=a;
    // 仅更新选项选择态 + 顶部进度, 不全量重绘
    const card=document.querySelector('.exam-card');
    if(card){
      card.querySelectorAll('.opt').forEach(o=>{
        const idx=+o.dataset.i;
        const sel = a.includes(idx);
        o.classList.toggle('sel', sel);
        const mk=o.querySelector('.mk');
        if(mk){ mk.textContent = q.type==='multiple' ? (sel?'☑':'☐') : (sel?'●':'○'); }
      });
    }
    // 更新顶部已答/进度
    const doneN=state.items.filter(it=>(state.answers[it.id]||[]).length>0).length;
    const np=document.querySelector('.exam-progress .nums b');
    if(np) np.textContent=doneN;
    const bar=document.querySelector('.exam-progress .bar i');
    if(bar) bar.style.width=Math.round(doneN/state.items.length*100)+'%';
    return;
  }
  const fb=document.getElementById('fb');
  if(fb && fb.innerHTML) return; // 已提交, 锁定
  let a=state.answers[q.id]||[];
  if(q.type==='multiple'){ if(a.includes(i))a=a.filter(x=>x!==i); else a.push(i); }
  else { a=[i]; }
  state.answers[q.id]=a;
  renderQuestion(); // 重绘以更新选中态
}

function submitAnswer(){
  const q=state.items[state.idx];
  const a=state.answers[q.id]||[];
  const fb=document.getElementById('fb');
  if(!a.length){alert('请先选择答案');return;}
  const correct = isCorrect(q, a);
  // 记录
  addUnique(STORE.done, q.id);
  if(correct){ addUnique(STORE.correct, q.id); removeUnique(STORE.wrong, q.id); }
  else { addUnique(STORE.wrong, q.id); }
  // 渲染反馈(三层解析: ①选项解析 ②出题思路 ③知识点回顾与讲解)
  if(fb) fb.innerHTML=analysisHtml(q, a, correct);
  // 标记选项
  const opts=document.querySelectorAll('.opt');
  opts.forEach(o=>{
    const i=+o.dataset.i;
    if(q.answer.includes(i)) o.classList.add('correct');
    else if(a.includes(i)) o.classList.add('wrong');
  });
  const sb=document.getElementById('submitBtn'); if(sb)sb.disabled=true;
  if(fb) window.scrollTo(0, fb.offsetTop-20);
}

function isCorrect(q,a){
  const ans=q.answer.slice().sort((x,y)=>x-y);
  const sel=a.slice().sort((x,y)=>x-y);
  if(sel.length!==ans.length) return false;
  for(let i=0;i<ans.length;i++) if(ans[i]!==sel[i]) return false;
  return true;
}

function prevQ(){
  if(state.idx>0){ state.idx--; renderQuestion(); }
}
function nextQ(){
  if(state.idx < state.items.length-1){ state.idx++; renderQuestion(); return; }
  // 最后一题
  if(state.mode==='mock' || state.mode==='round'){ tryFinish(); }
  else { alert('已经是最后一题啦'); }
}

/* ---------- 机考交卷(mock / round) ---------- */
function finishExam(){
  if(state.timer){clearInterval(state.timer); state.timer=null;}
  // 清掉 exam-bar / palette
  const eb=document.querySelector('.exam-bar'); if(eb) eb.remove();
  const ov=document.getElementById('paletteOverlay'); if(ov) ov.remove();
  // 计分
  let score=0; const wrongList=[];
  state.items.forEach(q=>{
    const a=state.answers[q.id]||[];
    score += scoreOf(q,a);
    if(!isCorrect(q,a)) wrongList.push(q.id);
    addUnique(STORE.done, q.id);
    if(isCorrect(q,a)){ addUnique(STORE.correct, q.id); removeUnique(STORE.wrong, q.id); }
    else { addUnique(STORE.wrong, q.id); }
  });
  // round 模式: 满分按题数*2(单选1, 多/案 2封顶); round 通过线 = 该轮总分 ≥ 80%
  const isMock = state.mode==='mock';
  // round 满分: 单题1分, 多选/案例子题封顶2分(按题型求和, 不写死题数×2)
  const roundMax = state.items.reduce((s,q)=> s + (q.type==='single'?1:2), 0);
  const totalScore = isMock ? DATA.meta.totalScore : roundMax;
  const passLine = isMock ? DATA.meta.passScore : Math.round(totalScore*0.8);
  const pass = score>=passLine;
  if(!isMock && state.round){ setRoundResult(state.round, score, pass); }
  const app=document.getElementById('app');app.innerHTML='';
  const headerBg = pass?'linear-gradient(135deg,#2f9e44,#51cf66)':'linear-gradient(135deg,#e03131,#fa5252)';
  const title = isMock ? '模拟考试结果' : ('三轮复习 · 第'+state.round+'/3 轮 成绩');
  let nextOnclick, nextText;
  if(isMock){
    nextOnclick = "startMode('mock')"; nextText = '再模拟一次';
  } else if(state.round<3){
    nextOnclick = "startMode('round',"+(state.round+1)+")"; nextText = '进入第 '+(state.round+1)+' 轮 →';
  } else {
    nextOnclick = "resetRoundsPicked();resetRoundResults();renderHome()"; nextText = '重新开始三轮';
  }
  const backOnclick = isMock? "renderHome()" : "renderRoundPicker()";
  const backText = isMock? '返回首页' : '查看进度';
  let html=`<header style="background:${headerBg}">
     <h1 class="center">${title}</h1>
     <div class="meta center">满分${totalScore} · 及格${passLine}</div></header>
     <div class="wrap"><div class="card center">
       <div class="big ${pass?'pass':'fail'}">${score}</div>
       <div class="${pass?'pass':'fail'}" style="font-weight:700">${pass?'🎉 恭喜，已达到及格线！':'未达及格线，继续加油'}</div>
       <div class="muted" style="margin-top:6px">共 ${state.items.length} 题 · 错题 ${wrongList.length} 题 · 用时 ${usedMinutes()} 分</div>
       <div style="display:flex;gap:10px;margin-top:14px">
         <button class="btn" onclick="${nextOnclick}">${nextText}</button>
         <button class="btn ghost" onclick="${backOnclick}">${backText}</button>
       </div>
     </div>`;
  // 三轮复习进度卡
  if(!isMock){
    const rr=getRoundResults();
    let nextBtn='';
    if(state.round<3){
      nextBtn = `<button class="btn" style="margin-top:10px" onclick="startMode('round',${state.round+1})">开始第 ${state.round+1} 轮 →</button>`;
    } else {
      const allPass = [1,2,3].every(r=> rr['r'+r] && rr['r'+r].pass);
      if(allPass){ nextBtn = `<button class="btn" style="margin-top:10px;background:var(--green)" onclick="renderHome()">🏆 三轮全过！返回首页</button>`; }
      else { nextBtn = `<button class="btn orange" style="margin-top:10px" onclick="resetRoundsPicked()">重置三轮历史,从头开始</button>`; }
    }
    html += `<div class="card" style="margin-top:12px">
       <div style="font-weight:700;margin-bottom:8px">📊 三轮通关情况</div>
       ${[1,2,3].map(r=>{
         const it=rr['r'+r];
         if(!it) return `<div class="result-row"><span>第 ${r} 轮</span><span class="muted">未开始</span></div>`;
         return `<div class="result-row"><span>第 ${r} 轮</span><span style="color:${it.pass?'var(--green)':'var(--red)'}">${it.score} 分 · ${it.pass?'✅ 通过':'❌ 未过'}</span></div>`;
       }).join('')}
       ${nextBtn}
     </div>`;
  }
  html += `<div class="card"><div style="font-weight:700;margin-bottom:6px">📝 错题回顾（点击看解析）</div><div id="wl"></div></div></div>`;
  app.appendChild(elf(html));
  // 恢复底部导航(机考时曾隐藏)
  const bot=document.querySelector('.bottom'); if(bot) bot.style.display='';
  const wl=document.getElementById('wl');
  if(!wrongList.length){ wl.innerHTML='<div class="muted">全部正确，太强了！</div>'; }
  else{
    wrongList.forEach(id=>{
      const q=state.items.find(x=>x.id===id)||ALL.find(x=>x.id===id);
      if(!q) return;
      wl.appendChild(el(`<div class="list-item">
        <div class="q" onclick="toggleWrong('${id}')" style="cursor:pointer">${esc((q.caseBg?'［案例］':'')+q.stem)}</div>
        <div class="muted" style="cursor:pointer" onclick="toggleWrong('${id}')">正确答案：${q.answer.map(i=>String.fromCharCode(65+i)).join('、')}　<span class="link">点开看讲解 ▾</span></div>
        <div class="wrong-detail" id="wd_${id}" style="display:none"></div></div>`));
    });
  }
  // 清理考试模式
  state.timer=null; state.mode='home'; state.round=null;
  renderBottom(isMock?'home':'home');
}
function usedMinutes(){
  if(!state.start) return 0;
  return Math.round((Date.now()-state.start)/60000);
}
function openRound(){
  // renderRoundPicker 用已有的渲染
  renderRoundPicker();
}

/* 三层解析 HTML(选项逐项 / 出题思路 / 本章思维导图), 供 submitAnswer 与结果页复用 */
function analysisHtml(q, a, correct){
  const ansTxt = q.answer.map(i=>String.fromCharCode(65+i)).join('、');
  const mind = DATA.mind[q.chapter] || {};
  let html=`<div class="analysis">
     <div class="h">${correct?'✅ <span class="ok">回答正确</span>':'❌ <span class="no">回答错误</span>'}　正确答案：${ansTxt}</div>`;
  html += `<div class="layer"><div class="layer-h">① 选项解析（逐项讲透）</div>`;
  if(q.analysis){ html += `<p>${esc(q.analysis)}</p>`; }
  (q.oa||[]).forEach((t,i)=>{
    const mk = q.answer.includes(i) ? 'ok' : 'no';
    html += `<div class="opt-note ${mk}"><b>${String.fromCharCode(65+i)}.</b> ${esc(t)}</div>`;
  });
  html += `</div>`;
  html += `<div class="layer"><div class="layer-h">② 出题思路</div><p>${esc(q.logic||'')}</p></div>`;
  html += `<div class="layer"><div class="layer-h">③ 知识点回顾与讲解（第${q.chapter}章）</div>`;
  if(mind.review){ html += `<p><b>知识回顾：</b>${esc(mind.review)}</p>`; }
  if(mind.detail){ html += `<p><b>详细讲解：</b>${esc(mind.detail)}</p>`; }
  if(mind.map){ html += `<details class="mm-box"><summary>展开本章思维导图</summary>${renderMind(mind.map,0)}</details>`; }
  html += `</div></div>`;
  return html;
}
/* 结果页错题: 点开内联展开三层解析 */
function toggleWrong(id){
  const box=document.getElementById('wd_'+id); if(!box) return;
  const q=state.items.find(x=>x.id===id)||ALL.find(x=>x.id===id);
  if(!q) return;
  const a=state.answers[q.id]||[];
  const correct=isCorrect(q,a);
  if(box.style.display==='none' || !box.innerHTML){
    box.innerHTML=analysisHtml(q, a, correct);
    box.style.display='block';
  } else { box.style.display='none'; }
}

function scoreOf(q,a){
  if(q.type==='single'){ return isCorrect(q,a)?1:0; }
  // 多选/案例子题: 错选0; 少选每正确项0.5; 全对2
  const ans=new Set(q.answer); const sel=new Set(a);
  for(const x of sel) if(!ans.has(x)) return 0; // 错选
  if(sel.size===ans.size) return 2;            // 全对
  return 0.5*sel.size;                          // 少选每项0.5
}

function backToMenu(){
  if(state.timer){clearInterval(state.timer); state.timer=null;}
  const eb=document.querySelector('.exam-bar'); if(eb) eb.remove();
  const ov=document.getElementById('paletteOverlay'); if(ov) ov.remove();
  if(state.mode==='mock' || state.mode==='round'){
    if(typeof confirm==='function' && !confirm('退出本次考试？当前进度将不计入成绩。')) return;
  }
  renderHome();
}

/* ---------- 底部导航 ---------- */
function renderBottom(active){
  let bar=document.querySelector('.bottom');
  if(!bar){ bar=el('<div class="bottom"></div>'); document.body.appendChild(bar); }
  const items=[
    {k:'home', ic:'🏠', t:'首页', fn:'renderHome()'},
    {k:'chapter', ic:'📚', t:'章节', fn:'renderChapters()'},
    {k:'know', ic:'🧠', t:'知识', fn:'renderKnowledge()'},
    {k:'wrong', ic:'❌', t:'错题', fn:"startMode(\'wrong\')"},
    {k:'mock', ic:'📝', t:'模考', fn:"startMode(\'mock\')"},
  ];
  bar.innerHTML=items.map(i=>`<div class="${i.k===active?'act':''}" onclick="${i.fn}"><span class="ic">${i.ic}</span>${i.t}</div>`).join('');
}

/* ---------- 知识页(以练: 先学后练) ---------- */
function renderMind(node, depth){
  if(Array.isArray(node)){ return node.map(n=>renderMind(n, depth)).join(''); }
  if(typeof node === 'string'){
    return `<div class="mm-leaf" style="margin-left:${depth*18}px">• ${esc(node)}</div>`;
  }
  let h=`<div class="mm-node" style="margin-left:${depth*10}px">${esc(node.t)}</div>`;
  (node.c||[]).forEach(c=>{ h += renderMind(c, depth+1); });
  return h;
}

function renderKnowledge(){
  const app=document.getElementById('app');app.innerHTML='';
  app.appendChild(topbar('知识回顾（以练）', null, ()=>renderHome()));
  const wrap=el('<div class="wrap"></div>');
  wrap.appendChild(el(`<div class="card" style="font-size:13.5px;color:#374151">
    先理解再刷题：点开任意章节，查看<b>思维导图 + 知识回顾 + 详细讲解</b>，吃透知识点后再去练习，避免"以考代学"。</div>`));
  DATA.chapters.forEach(ch=>{
    const m=DATA.mind[ch.id]||{};
    wrap.appendChild(el(`<div class="kp-card" onclick="renderChapterKnowledge(${ch.id})">
       <div><div class="nm">${ch.id}. ${esc(ch.name)}</div>
            <div class="w">${m && m.map ? (m.map.length+'个知识模块'):' '} · 估分${esc(ch.weight)}</div></div>
       <div style="font-size:22px;color:var(--primary)">›</div></div>`));
  });
  app.appendChild(wrap);
  renderBottom('know');
}

function renderChapterKnowledge(chId){
  const ch=DATA.chapters.find(c=>c.id===chId)||{};
  const m=DATA.mind[chId]||{};
  const app=document.getElementById('app');app.innerHTML='';
  app.appendChild(topbar(ch.id+'. '+ch.name, null, ()=>renderKnowledge()));
  const wrap=el('<div class="wrap"></div>');
  wrap.appendChild(el(`<div class="card">
     <div class="kp-section"><div class="h">🧠 知识回顾</div>
        <div class="kp-block">${m.review?esc(m.review):'—'}</div></div>
     <div class="kp-section"><div class="h">📖 详细讲解</div>
        <div class="kp-block">${m.detail?esc(m.detail):'—'}</div></div>
     <div class="kp-section"><div class="h">🌳 思维导图</div>
        <div class="mm-box" style="margin-top:4px">${m.map?renderMind(m.map,0):'—'}</div></div>
     <div class="kp-act"><button class="btn" onclick="startMode('chapter',${chId})">开始本章练习 →</button></div>
  </div>`));
  app.appendChild(wrap);
  renderBottom('know');
}

/* ---------- 重置学习数据 ---------- */
function resetData(){
  if(confirm('确定清空所有练习进度与错题记录？此操作不可恢复。')){
    [STORE.wrong,STORE.done,STORE.correct,STORE.fav].forEach(k=>localStorage.removeItem(pkey(k)));
    localStorage.removeItem(pkey('lastpos'));
    renderHome();
  }
}

/* ---------- 启动 ---------- */
boot();
</script>
